baseURL: "https://hugo-profile.netlify.app"
languageCode: "en-us"
title: "personal portfolio"


# Multilingual configuration
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

Menus:
  main:
    - identifier: gallery
      name: Gallery
      title: Gallery
      url: /gallery
      weight: 2
    #Dropdown menu
    # - identifier: dropdown
    #   title: Example dropdown menu
    #   name: Dropdown
    #   weight: 3
    # - identifier: dropdown1
    #   title: example dropdown 1
    #   name: example 1
    #   url: /#
    #   parent: dropdown
    #   weight: 1
    # - identifier: dropdown2
    #   title: example dropdown 2
    #   name: example 2
    #   url: /#
    #   parent: dropdown
    #   weight: 2

params:
  title: "personal portfolio"
  description: "과제 제출용 개인 포트폴리오 사이트"
  # staticPath: ""  # The path to serve the static files from
  favicon: "/fav.png"

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    # disableThemeToggle: true
    # defaultTheme: "light" # dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  # color:
  #   textColor: "#343a40"
  #   secondaryTextColor: "#6c757d"
  #   textLinkColor: "#007bff"
  #   backgroundColor: "#eaedf0"
  #   secondaryBackgroundColor: "#64ffda1a"
  #   primaryColor: "#007bff"
  #   secondaryColor: "#f8f9fa"

  #   darkmode:
  #     textColor: "#e4e6eb"
  #     secondaryTextColor: "#b0b3b8"
  #     textLinkColor: "#ffffff"
  #     backgroundColor: "#18191a"
  #     secondaryBackgroundColor: "#212529"
  #     primaryColor: "#ffffff"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    # showBrandLogo: false # Show brand logo in nav bar | default is true
    brandName: "Hugo Profile" # Brand name for the brand | default is the title variable
    disableSearch: false
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: false
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: true
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "안녕하세요, 저는"
    title: "남재희"
    subtitle: "웹개발과 알고리즘을 공부중"
    content: "저는 전북대학교 컴퓨터인공지능학부를 재학 중인 남재희라고합니다. 현재는 웹 개발과 알고리즘 문제에 관심을 가지며 열심히 공부하고 있습니다."
    image: /images/hero.svg
    bottomImage:
      enable: true
    button:
      enable: false
    # roundImage: true # Make hero image circular | default false
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/spacewraith

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.png"
    content: |-
      저는 현재 전북대학교 컴퓨터인공지능학부에 재학 중인 학부생입니다. 
      
      단순히 페이지로 정해진 정보를 보여주는 것을 넘어 클라우드 등 인터넷을 기반으로 한 다양한 서비스의 기준이 된 웹에 흥미를 느껴 웹개발을 공부하게 되었습니다.

      또한 학교에서 배운 전공 지식을 실제 코드로 구현 하며 문제를 해결하는 경쟁적 코딩에도 관심을 가져 연습 중이고 실제로 교내 수상을 한 성과를 내었습니다.


      지금은 학교 수업 프로젝트의 일환으로 웹을 기반으로 한 온라인 바둑 서비스를 제작하고 있고 서비스 가능한 수준의 웹서비스를 처음부터 끝까지 온전히 개발해 보는 것을 목표로 하고있습니다.
      그 과정에서 현재 재엔드 작성을 위한 nodejs, 프론트엔드 작성을 위한 react를 학습하고 있으며 실제로 현재 nodejs를 통해 프로젝트의 백엔드 코드를 작성하고 있습니다.
    skills:
      enable: true
      title: "제가 현제 사용할 수 있는 기술을 다음과 같습니다."
      items:
        - "HTML"
        - "CSS"
        - "JavaScript"
        - "React"
        - "Node"
        - "SQL"
        - "C++"
        - "Java"

  # Experience
  experience:
    enable: true
    title: "Projects"
    items:
      - company: "웹기반 온라인 바둑 서비스" 
        companyUrl: 
        jobs:
          - name: "프로젝트 소개"
            date: "2026년 10월 - 진행중"
            content: "현재 진행 중인 프로젝트로 온라인으로 상대방과 매칭돼 바둑 게임을 즐길 수 있는 게임 웹사이트입니다."
            info:
              content: Working as a senior software developer
          - name: "프로젝트 목적"
            content: "이 프로젝트의 목적은 프론트엔드, 백엔드, 데이터베이스 등 웹 서비스의 전반을 직접 구현함으로써 웹개발의 역량을 늘리고 실제 서비스가 가능한 수준의 웹 페이지를 실제로 구현해 보는 경험을 쌓는 것입니다."
          - name: "프로젝트 역할"
            content: "이 프로젝트에서 저는 백엔드 서버의 코드를 작성하고 데이터베이스의 스키마를 설계하는 역할을 맡고 있습니다."


  # Education
  education:
    enable: true
    # title: "Custom Name"
    index: false
    items:
      - title: "대학학사"
        school:
          name: "전북대학교 컴퓨터공학부 학사과정 재학중"
          url: "https://csai.jbnu.ac.kr/csai/index.do"
        date: "2022 - 재학중"
        GPA: "현재 기준 4.34"
        content: |-
          교과 외 활동
            - 알고리즘 동아리 alps 활동 중, icpc 참가 및 교내 상 수상
            - 보안 동아리 rams 활동 중
      - title: "고등학교"
        school:
          name: "순천 고등학교 졸업"
          url: "https://suncheon.jge.hs.kr/sunchon_hs/main.do?sysId=sunchon_hs"

  # Achievements
  achievements:
    enable: true
    # title: "Custom Name"
    items:
      - title: 제 25회 TOPCIT 정기평가 교내 1위 및 총장상 수상
        content: 717점 수준 4로 교내 1위 달성
        image: /images/achievement.jpg
      - title: 2026 ICPC 경시대회 교내 최우수상 수상
        content: 교내 2위로 수상
        image: /images/achievement.jpg

  # projects
  projects:
    enable: false
    # title: "Custom Name"
    items:
      - title: Hugo Profile
        content: A highly customizable and mobile first Hugo template for personal portfolio and blog.
        image: /images/projects/profile.png
        featured:
          name: Demo
          link: https://hugo-profile.netlify.app
        badges:
          - "Hugo"
          - "Bootstrap"
          - "Javascript"
        links:
          - icon: fa fa-envelope
            url: mailto:?subject=Hugo%20Profile%20Template&body=Check%20it%20out:%20https%3a%2f%2fhugo-profile.netlify.app%2fblog%2fmarkdown-syntax%2f
          - icon: fab fa-github
            url: https://github.com/gurusabarish/hugo-profile
          - icon: fab fa-twitter
            url: https://twitter.com/intent/tweet?text=Check+it+out:&url=https%3A%2F%2Fgithub.com%2Fgurusabarish%2Fhugo-profile

      - title: Image Converter
        content: A web app to convert image to pdf, png to jpg, png to jpg and png to webp without database using django.
        image: /images/projects/converter.jpg
        featured:
          name: Demo
          link: https://django-converter.herokuapp.com
        badges:
          - "Django"
          - "Bootstrap"
        links:
          - icon: fab fa-github
            url: https://github.com/gurusabarish/converter

      - title: Hugo Profile V2
        content: A clean and simple Hugo template for personal portfolio and blog.
        image: /images/projects/profile2.jpg
        featured:
          name: Demo V2
          link: https://hugo-profile-2.netlify.app
        badges:
          - "Hugo"
          - "Bootstrap"
          - "Javascript"
        links:
          - icon: fab fa-github
            url: https://github.com/gurusabarish/HugoProfileV2

  #Contact
  contact:
    enable: true
    # title: "Custom Name"
    content: 연락이 필요하다면 언제든지 이메일을 보내주세요!
    btnName: Mail me
    btnLink: mailto:gurusabarisha@gmail.com
    # formspree:
    #   enable: true # `contact.email` value will be ignored
    #   formId: abcdefgh # Take it from your form's endpoint, like 'https://formspree.io/f/abcdefgh'
    #   emailCaption: "Enter your email address"
    #   messageCaption: "Enter your message here"
    #   messageRows: 5

  footer:
    recentPosts:
      path: "blogs"
      count: 3
      title: Recent Posts
      enable: true
      disableFeaturedImage: false
    socialNetworks:
      github: https://github.com
      linkedin: https://linkedin.com
      twitter: https://twitter.com
      instagram: https://instagram.com
      facebook: https://facebook.com

  # List pages like blogs and posts
  listPages:
    disableFeaturedImage: false

  # Single pages like blog and post
  singlePages:
    socialShare: true
    readTime:
      enable: true
      content: "min read"
    scrollprogress:
      enable: true
    tags:
      openInNewTab: true

  # For translations
  terms:
    read: "Read"
    toc: "Table Of Contents"
    copyright: "All rights reserved"
    emailText: "Check out this site"

  datesFormat:
    article: "Jan 2, 2006"
    articleList: "Jan 2, 2006"
    articleRecent: "Jan 2, 2006"

  #customScripts: -| # You can add custom scripts which will be added before </body> tag
  #  <script type="text/javascript"><!-- any script here --></script>
